    /* ---------------- Unified Action Dispatch & Popovers ---------------- */
    async function dispatchAction(action, params={}, target="fairy") {
      const route = routeAction(action, target);
      if (route.route === "unavailable") {
        showToast(route.reason);
        return null;
      }
      if (route.route === "direct") {
        showToast(`正在执行 ${ACTIONS[action].label}...`);
        const res = await TRANSPORT.runLocalAction(action, params);
        showToast(res.summary || `${ACTIONS[action].label} 完成`);
        await refreshState(true);
        return res;
      }
      const res = await TRANSPORT.enqueue(route.target, action, params);
      showToast(`已派发给 ${route.target}，稍后自动回传结果`);
      await refreshState(true);
      scheduleAdaptivePoll();
      return res;
    }

    function openPopover(anchorEl, items) {
      const pop = document.getElementById("popover");
      pop.innerHTML = items.map((it, i) => `
        <button class="popover__item" data-pop-idx="${i}" ${it.disabled ? "disabled style='opacity:0.45;cursor:not-allowed;'" : ""}>
          ${it.dot ? `<span class="dot" data-s="${esc(it.dot)}"></span>` : ""}
          <span>${esc(it.label)}</span>
        </button>
      `).join("");
      const rect = anchorEl.getBoundingClientRect();
      pop.style.left = Math.min(rect.left, window.innerWidth - 200) + "px";
      pop.style.top = (rect.bottom + 4) + "px";
      pop.classList.add("open");
      pop._handlers = items.map(it => it.onClick);
    }

    function closePopover() {
      document.getElementById("popover").classList.remove("open");
    }

    /* ---------------- Event Delegation ---------------- */
    document.addEventListener("click", async e => {
      const popBtn = e.target.closest("[data-pop-idx]");
      if (popBtn) {
        const pop = document.getElementById("popover");
        const fn = pop._handlers && pop._handlers[Number(popBtn.getAttribute("data-pop-idx"))];
        closePopover();
        if (fn) await fn();
        return;
      }
      if (!e.target.closest("#popover") && !e.target.closest('[data-action^="pop-"]')) {
        closePopover();
      }

      const actEl = e.target.closest("[data-action]");
      if (!actEl) return;
      const action = actEl.getAttribute("data-action");

      if (action === "submit-auth") { await submitAuth(); return; }
      if (action === "switch-view") {
        ACTIVE_VIEW = actEl.getAttribute("data-view");
        document.getElementById("nav-discuss").setAttribute("aria-selected", ACTIVE_VIEW === "discuss");
        document.getElementById("nav-progress").setAttribute("aria-selected", ACTIVE_VIEW === "progress");
        document.getElementById("view-discuss").classList.toggle("active", ACTIVE_VIEW === "discuss");
        document.getElementById("view-progress").classList.toggle("active", ACTIVE_VIEW === "progress");
        renderAll();
        return;
      }
      if (action === "open-drawer") {
        document.getElementById("drawer-backdrop").classList.add("open");
        document.getElementById("drawer").classList.add("open");
        renderDrawer();
        return;
      }
      if (action === "close-drawer") {
        document.getElementById("drawer-backdrop").classList.remove("open");
        document.getElementById("drawer").classList.remove("open");
        return;
      }
      if (action === "manual-refresh") {
        showToast("正在同步...");
        await refreshState(true);
        showToast("已更新到最新状态");
        return;
      }
      if (action === "filter-tasks") {
        TASK_FILTER = actEl.getAttribute("data-filter");
        document.querySelectorAll('[data-action="filter-tasks"]').forEach(b => b.setAttribute("aria-pressed", b === actEl));
        renderDiscussList();
        return;
      }
      if (action === "select-task") {
        SELECTED_TASK_ID = actEl.getAttribute("data-tid");
        document.getElementById("discuss-shell").setAttribute("data-mobile", "detail");
        renderDiscussList();
        renderDiscussCanvas();
        return;
      }
      if (action === "mobile-back") {
        document.getElementById("discuss-shell").setAttribute("data-mobile", "list");
        return;
      }
      if (action === "toggle-rules") {
        RULES_EXPANDED = !RULES_EXPANDED;
        renderDiscussCanvas({ preserveComposerFocus: true });
        return;
      }
      if (action === "ack-directive") {
        const did = actEl.getAttribute("data-did");
        await TRANSPORT.ackDirective(did);
        showToast(`已确认知晓规则 ${did}`);
        await refreshState(false);
        return;
      }
      if (action === "toggle-subtask") {
        const tid = actEl.getAttribute("data-tid");
        const idx = Number(actEl.getAttribute("data-idx"));
        const done = actEl.getAttribute("data-done") === "true";
        await TRANSPORT.toggleSubtask(tid, idx, done);
        await refreshState(false);
        return;
      }
      if (action === "pop-status") {
        const tid = actEl.getAttribute("data-tid");
        openPopover(actEl, Object.entries(STATUS_LABELS).map(([k, lbl]) => ({
          dot: k, label: lbl,
          onClick: async () => { await TRANSPORT.updateTask(tid, { status: k }); await refreshState(false); },
        })));
        return;
      }
      if (action === "pop-owner") {
        const tid = actEl.getAttribute("data-tid");
        openPopover(actEl, ["刘俊圆", "王瑞麟", "待商定"].map(o => ({
          label: o,
          onClick: async () => { await TRANSPORT.updateTask(tid, { owner: o }); await refreshState(false); },
        })));
        return;
      }
      if (action === "set-composer-mode") {
        COMPOSER_MODE = actEl.getAttribute("data-mode");
        renderDiscussCanvas();
        return;
      }
      if (action === "toggle-rule-scope") {
        RULE_SCOPE = RULE_SCOPE === "task" ? "global" : "task";
        renderDiscussCanvas({ preserveComposerFocus: true });
        return;
      }
      if (action === "dismiss-conflict") {
        document.getElementById("composer-conflict").classList.remove("show");
        return;
      }
      if (action === "copy-ai-prompt") {
        const tid = actEl.getAttribute("data-tid");
        const p = `请先阅读 ONBOARDING_FOR_AI.md 与 AGENTS.md，执行 python cb.py checkpoint --task ${tid} 与 python cb.py ctx --task ${tid}，阅读最新讨论与团队规则后推进任务，完成后运行 python cb.py verify --lite 并执行 handoff。`;
        await navigator.clipboard.writeText(p);
        showToast(`已复制 ${tid} 的 AI 提示词`);
        return;
      }
      if (action === "submit-composer") {
        await submitComposer(actEl.getAttribute("data-tid"));
        return;
      }
      if (action === "open-new-task") {
        document.getElementById("new-task-modal").classList.add("open");
        return;
      }
      if (action === "close-new-task") {
        document.getElementById("new-task-modal").classList.remove("open");
        return;
      }
      if (action === "submit-new-task") {
        const title = document.getElementById("nt-title").value.trim();
        if (!title) { showToast("请先填写任务标题"); return; }
        const subs = document.getElementById("nt-subs").value.split("\n").map(x => x.trim()).filter(Boolean);
        const created = await TRANSPORT.createTask({
          title,
          description: document.getElementById("nt-desc").value.trim(),
          subtasks: subs,
          axis: document.getElementById("nt-axis").value,
          owner: document.getElementById("nt-owner").value,
          case_id: document.getElementById("nt-case").value,
          lite_compatible: document.getElementById("nt-lite").checked,
        });
        document.getElementById("nt-title").value = "";
        document.getElementById("nt-desc").value = "";
        document.getElementById("nt-subs").value = "";
        document.getElementById("new-task-modal").classList.remove("open");
        if (created && created.task_id) SELECTED_TASK_ID = created.task_id;
        showToast(`已创建任务 ${SELECTED_TASK_ID}`);
        await refreshState(false);
        return;
      }
      if (action === "sync-fairy-telem") {
        await dispatchAction("sync_telemetry", {}, "fairy");
        return;
      }
      if (action === "pop-run-menu") {
        const rSmoke = routeAction("run_smoke_fsi", "fairy");
        const rFreeze = routeAction("freeze_baseline", "fairy");
        const hasRunning = Object.values(STATE.local_runs || {}).some(r => r.status === "IN_PROGRESS_ON_FAIRY");
        const isLiu = AUTH.actor === "刘俊圆";
        const items = [
          {
            label: "运行 3D 冒烟自检 (60 帧)",
            disabled: rSmoke.route === "unavailable",
            onClick: async () => {
              if (confirm("确认在 fairy 上运行 4 场景 × 60 帧真实 3D 冒烟自检？")) {
                await dispatchAction("run_smoke_fsi", {}, "fairy");
              }
            },
          },
        ];
        if (isLiu) {
          items.push({
            label: hasRunning ? "跑完后自动封存基线 (v2.1)" : "立即封存完整 3600 帧基线",
            disabled: rFreeze.route === "unavailable",
            onClick: async () => {
              const msg = hasRunning ? "确认挂钩等待当前 3600 帧完成后自动封存并推送至仓库？" : "确认将当前 4 组完整 3600 帧结果封存为 v2.1_verified 基线？";
              if (confirm(msg)) {
                await dispatchAction("freeze_baseline", { tag: "v2.1_verified", when_complete: true }, "fairy");
              }
            },
          });
        }
        openPopover(actEl, items);
        return;
      }
      if (action === "darkroom-case") {
        DARKROOM_CASE = actEl.getAttribute("data-case");
        DARKROOM_PLAYING = false;
        renderProgressView();
        return;
      }
      if (action === "darkroom-toggle-play") {
        DARKROOM_PLAYING = !DARKROOM_PLAYING;
        loadDarkroomStage();
        return;
      }
      if (action === "darkroom-fullscreen") {
        const stg = document.getElementById("darkroom-stage");
        if (stg && stg.requestFullscreen) stg.requestFullscreen();
        return;
      }
      if (action === "rerun-verify-lite") {
        const res = await dispatchAction("verify_lite", {}, "fairy");
        if (res && res.ok !== undefined && TRANSPORT.kind === "local_agent") {
          await refreshState(true);
        }
        return;
      }
      if (action === "copy-text") {
        await navigator.clipboard.writeText(actEl.getAttribute("data-val") || "");
        showToast("已复制到剪贴板");
        return;
      }
      if (action === "toggle-lan-tok") {
        LAN_TOKEN_REVEALED = !LAN_TOKEN_REVEALED;
        renderDrawer();
        return;
      }
      if (action === "logout") {
        clearAuthCreds();
        document.getElementById("drawer-backdrop").classList.remove("open");
        document.getElementById("drawer").classList.remove("open");
        openAuthModal();
        return;
      }
      if (action === "invite-collab") {
        const uname = document.getElementById("invite-username").value.trim().replace(/^@/, "");
        if (!uname) return;
        if (TRANSPORT.kind === "local_agent") {
          const r = await localApi("/api/provision/invite", "POST", { username: uname });
          showToast(r.message || "已发送邀请");
        } else {
          await ghFetch(`/repos/${AUTH.repo}/collaborators/${encodeURIComponent(uname)}`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ permission: "push" }),
          });
          showToast(`已向 @${uname} 发送私有仓库协作者邀请`);
        }
        return;
      }
      if (action === "fix-item") {
        showToast("正在补齐系统依赖...");
        await localApi("/api/provision/fix", "POST", { fix_action: actEl.getAttribute("data-fix") });
        await refreshState(true);
        showToast("依赖补齐完成");
        return;
      }
      if (action === "auto-fix-all") {
        showToast("正在检查并自动补齐全部缺失依赖...");
        await localApi("/api/provision/auto-all", "POST", { include_optional: false });
        await refreshState(true);
        showToast("环境自检与补齐已完成");
      }
    });

    async function submitComposer(tid) {
      const box = document.getElementById("composer-text");
      const text = box ? box.value.trim() : "";
      try {
        if (COMPOSER_MODE === "ai") {
          const target = document.getElementById("ai-target-sel").value;
          const agent = document.getElementById("ai-agent-sel").value;
          if (text) {
            await TRANSPORT.commentTask(tid, `[AI 任务指示] ${text}`, { asDirective: false });
          }
          DRAFTS[tid] = "";
          if (box) box.value = "";
          await dispatchAction("wake_ai_task", { task_id: tid, agent }, target);
          return;
        }
        if (!text) return;
        await TRANSPORT.commentTask(tid, text, { asDirective: COMPOSER_MODE === "rule", scope: RULE_SCOPE });
        DRAFTS[tid] = "";
        if (box) box.value = "";
        showToast(COMPOSER_MODE === "rule" ? "已置顶为新团队规则" : "已发送");
        await refreshState(false);
      } catch (e) {
        showToast("操作失败：" + (e.message || String(e)));
      }
    }

    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        const box = document.getElementById("composer-text");
        if (box && document.activeElement === box) {
          e.preventDefault();
          submitComposer(box.getAttribute("data-tid"));
        }
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && document.getElementById("app").style.display !== "none") {
        refreshState(false, true);
      }
    });

    boot();
  </script>
</body>
</html>
